name: Autonomous Quota Reset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write
  actions: write

jobs:
  reset-or-resume:
    runs-on: ubuntu-latest
    if: ${{ vars.AUTONOMOUS_LOOP_ENABLED == 'true' }}
    steps:
      # Pinned to a commit SHA, not a tag: a tag is a movable pointer, so whoever
      # controls the action's repository can repoint v4 at new code that then runs
      # here with this job's contents:write + actions:write GITHUB_TOKEN (it can
      # dispatch other workflows). Disabled today, but a movable tag on a disabled
      # workflow is still a hole the day someone enables it. The trailing comment
      # records the tag the SHA came from so Dependabot can still offer bumps.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reset Quota State If UTC Date Rolled Over (Watchdog)
        env:
          GH_TOKEN: ${{ secrets.JULES_GITHUB_PAT }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -u
          TODAY=$(date -u +%Y-%m-%d)
          STATE_FILE=".jules/state/quota-state.json"
          mkdir -p .jules/state

          if [ ! -f "$STATE_FILE" ]; then
            echo "quota-state.json missing — initializing and dispatching analysis loop."
            echo '{ "exhausted_date": null, "sessions_today": 0 }' > "$STATE_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "chore(jules): init quota state (reset watchdog)" || true
            git push || echo "WARN: failed to push init quota-state."
            gh workflow run autonomous-analysis.yml -R "${REPO_FULL}" \
              || echo "WARN: failed to dispatch autonomous-analysis.yml."
            exit 0
          fi

          EXHAUSTED=$(jq -r '.exhausted_date // "null"' "$STATE_FILE" 2>/dev/null || echo "null")
          SESSIONS_TODAY=$(jq -r '.sessions_today // 0' "$STATE_FILE" 2>/dev/null || echo "0")
          echo "Watchdog: exhausted_date=$EXHAUSTED sessions_today=$SESSIONS_TODAY today=$TODAY"

          if [ "$EXHAUSTED" = "null" ]; then
            # Quota not exhausted — loop should already be running. Re-dispatch as a safety net.
            echo "exhausted_date is null — nudging analysis loop to ensure it's running."
            gh workflow run autonomous-analysis.yml -R "${REPO_FULL}" \
              || echo "WARN: failed to dispatch autonomous-analysis.yml."
            exit 0
          fi

          if [ "$EXHAUSTED" = "$TODAY" ]; then
            echo "Quota still exhausted for $TODAY (UTC, sessions_today=$SESSIONS_TODAY). Waiting for next UTC rollover."
            exit 0
          fi

          # EXHAUSTED < TODAY ⇒ UTC date rolled over ⇒ Google resets the daily quota
          # AND the daily Analyst target (100/UTC day) resets. Clear BOTH fields.
          echo "UTC date rolled over ($EXHAUSTED < $TODAY). Clearing quota state (exhausted_date + sessions_today) and resuming loop."
          jq -n '{exhausted_date: null, sessions_today: 0}' > "$STATE_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "chore(jules): quota reset ${TODAY} (UTC rollover, sessions_today cleared)" || true
          git push || { echo "WARN: failed to push quota-reset commit."; exit 0; }

          gh workflow run autonomous-analysis.yml -R "${REPO_FULL}" \
            || echo "WARN: failed to dispatch autonomous-analysis.yml after reset."
