name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.0.0)'
        required: false
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Distribution
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Release Artifacts
        env:
          NVGW_GH_OWNER: ${{ github.repository_owner }}
          # Pinned to the source repository: packaging publishes Releases to the
          # very repo this workflow runs in (github.com/HaYkMnE/NV-Gateway),
          # matching the packaging-env-guard DEFAULT_RELEASE_REPOSITORY.
          NVGW_GH_REPO: NV-Gateway
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:release

      - name: Archive Portable Distribution as ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/NV-Gateway $version.exe" -DestinationPath "dist/NV-Gateway-$version-win-x64.zip" -Force

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe, dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: NV-Gateway ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/NV-Gateway-Setup-*.exe
            dist/NV-Gateway-*.zip
            dist/latest.yml
            dist/SHA256SUMS.txt
