name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Distribution
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to a COMMIT SHA, not a tag. A tag is a
      # movable pointer: whoever controls the action's repository can repoint v4
      # at new code, and that code would run here with this job's GITHUB_TOKEN
      # (contents: write) and, below, with the release PAT in its environment. A
      # SHA is immutable, so a compromised or rewritten tag cannot change what
      # executes. The trailing comment records the tag each SHA was resolved from
      # so Dependabot (.github/dependabot.yml tracks github-actions) can still
      # offer readable bumps.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'

      # The app's update feed is BAKED at package time: electron-builder expands
      # ${env.NVGW_GH_OWNER}/${env.NVGW_GH_REPO} into resources/app-update.yml, and
      # NVGW_GH_REPO is deliberately left unset here so the documented default
      # (NV-Gateway-releases) applies. That is a DIFFERENT repository from the one
      # this workflow runs in, and the default GITHUB_TOKEN cannot create releases
      # there. Without this gate the job would happily upload the installer and
      # latest.yml to the source repo, report success, and leave every installed
      # copy polling a feed that never gains a release.
      #
      # It runs before npm ci and before the build on purpose: the answer is known
      # at second zero, so there is no reason to spend a full Windows packaging run
      # discovering it. It has no `if:` and no continue-on-error — a soft failure
      # here would restore exactly the silent-success mode it removes.
      - name: Verify the release can reach the baked update feed
        id: release-target
        env:
          NVGW_GH_OWNER: ${{ github.repository_owner }}
          NVGW_RELEASES_TOKEN: ${{ secrets.NVGW_RELEASES_TOKEN }}
        run: node scripts/release-target-guard.mjs

      - name: Install dependencies
        run: npm ci

      # No GH_TOKEN here, deliberately. This step runs electron-builder and its
      # whole transitive dependency tree plus the afterPack hook, so any credential
      # in its environment is readable by all of that code — and GITHUB_TOKEN
      # carries `contents: write` on this repository (see permissions: above).
      #
      # It is not needed, read out of the dependency rather than assumed:
      #   * `--publish never` sets isPublish = false
      #     (app-builder-lib/out/publish/PublishManager.js:63), so nothing is
      #     uploaded from this step and createPublisher/scheduleUpload — the only
      #     paths that construct GitHubPublisher, which is what actually reads
      #     GH_TOKEN (electron-publish/out/gitHubPublisher.js:22-28) — never run.
      #   * The token-sniffing fallback at PublishManager.js:338 sits behind
      #     `if (publishers == null)`. electron-builder.yml:92-95 declares the
      #     publish block explicitly, so publishers is never null and that branch
      #     is unreachable.
      #   * Baking app-update.yml goes through getAppUpdatePublishConfiguration
      #     (:193-210) -> getResolvedPublishConfig (:383), which for provider
      #     github with owner and repo already set resolves at :414-427 without
      #     reading any token.
      #
      # If that analysis were ever wrong, electron-builder throws
      # InvalidConfigurationError("GitHub Personal Access Token is not set") and
      # the release fails LOUDLY — it cannot degrade into a silent bad package.
      - name: Build and Package Release Artifacts
        env:
          NVGW_GH_OWNER: ${{ github.repository_owner }}
        run: |
          npm run build:release

      # The update feed is BAKED into resources/app-update.yml at package time, and
      # that file is the ONLY thing telling electron-updater which repository to
      # poll. It is not written unconditionally: app-builder-lib returns early
      # unless a target is updater-aware (PublishManager.js:81-84 +
      # isSuitableWindowsTarget at :361-366 — nsis, nsis-*, updater-aware appx).
      #
      # So the CI `Packaged audit` job can NEVER see it: that job packages with
      # `--dir`, which builds no installer target and therefore writes no
      # app-update.yml. Measured against a real `npm run package:dir`:
      # dist/win-unpacked/resources/ held app.asar and assets/ only.
      #
      # An absent or misdirected feed fails SILENTLY — the installer works, the app
      # runs, and update checks just never find anything. The owner's installed
      # build has no app-update.yml at all and nothing ever reported it. This gate
      # runs AFTER packaging (the file cannot exist before) and BEFORE both uploads,
      # so a build that cannot auto-update never becomes a published release.
      - name: Verify the update feed was baked into the package
        env:
          # Same owner packaging used, so the expectation cannot drift from what was
          # baked. NVGW_GH_REPO stays UNSET here, exactly as above.
          NVGW_GH_OWNER: ${{ github.repository_owner }}
        run: node scripts/verify-baked-update-feed.mjs

      - name: Archive Portable Distribution as ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/NV-Gateway $version.exe" -DestinationPath "dist/NV-Gateway-$version-win-x64.zip" -Force

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe, dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content dist/SHA256SUMS.txt

      # ── Destination 1 of 2: the UPDATE FEED (github.com/<owner>/NV-Gateway-releases)
      #
      # This is the destination that matters for auto-update. electron-updater on the
      # user's machine reads latest.yml from the repo baked into app-update.yml, then
      # downloads the installer that latest.yml names. Both must be here or an update
      # check finds nothing (no latest.yml) or resolves to a 404 (no installer).
      #
      # The .blockmap is listed SEPARATELY and on purpose: the installer glob ends in
      # `.exe`, which does not match `NV-Gateway-Setup-<version>.exe.blockmap`. Without
      # its own entry the blockmap is silently left behind and every update degrades
      # from a differential download to a full ~82 MB one.
      #
      # `repository:` comes from the guard above rather than a second literal, so the
      # upload target and the baked feed cannot drift apart again. `token:` must be the
      # PAT: the default GITHUB_TOKEN is scoped to this repository and cannot create a
      # release in another one. The guard has already failed the job if it is missing.
      - name: Publish to the update feed repository
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ steps.release-target.outputs.feed_repository }}
          token: ${{ secrets.NVGW_RELEASES_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: NV-Gateway ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          # A glob that matches nothing must fail the release. A partially populated
          # feed is worse than no release: it looks published and updates nobody.
          fail_on_unmatched_files: true
          files: |
            dist/NV-Gateway-Setup-*.exe
            dist/NV-Gateway-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      # ── Destination 2 of 2: this repository, for the README download links
      #
      # README.md:17 and README.md:158 send users to this repo's releases page for the
      # installer, so it keeps getting a release. Previously that happened only because
      # the step above had no `repository:` input and fell back to the current repo —
      # the very accident that broke the feed. It is now a deliberate, separate step.
      #
      # latest.yml is intentionally NOT published here: electron-updater never reads
      # this repo, and a stale copy sitting next to a real feed only invites confusion
      # about which one is authoritative.
      - name: Publish to this repository for the README download links
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: NV-Gateway ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/NV-Gateway-Setup-*.exe
            dist/NV-Gateway-*.zip
            dist/SHA256SUMS.txt
