name: Autonomous Change

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      # PLACEHOLDER-DEFAULT-BRANCH

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: windows-latest
    if: ${{ vars.AUTONOMOUS_LOOP_ENABLED == 'true' }}
    steps:
      # Pinned to commit SHAs, not tags: a tag is a movable pointer, so whoever
      # controls the action's repository can repoint v4 at new code that then runs
      # here. Disabled today, but a movable tag on a disabled workflow is still a
      # supply-chain hole the day someone enables it. The trailing comment records
      # the tag each SHA came from so Dependabot (.github/dependabot.yml tracks
      # github-actions) can still offer bumps.
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Sandbox Dir
        shell: pwsh
        run: New-Item -ItemType Directory -Path "C:\OPENCODE-SANDBOX" -Force -ErrorAction SilentlyContinue

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

  bug-hunter-review:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always() && vars.AUTONOMOUS_LOOP_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Bug Hunter Evaluation
        # Third-party action, so the SHA pin matters most here: this step receives
        # secrets.JULES_BUG_HUNTER_API_KEY and a GITHUB_TOKEN in its environment.
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: 'Read .jules/roles/bug-hunter.md and act as the Bug Hunter. Review PR #${{ github.event.pull_request.number }}. Read the CI test results. Enforce the 2 CLEAN passes rule. If the code is flawed or tests failed, use the GitHub CLI to leave a review requesting changes. If everything is perfect, approve the PR. Output a JSON verdict matching bug-hunter-verdict.schema.json.'
          jules_api_key: ${{ secrets.JULES_BUG_HUNTER_API_KEY }}

