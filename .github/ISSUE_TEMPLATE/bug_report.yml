name: Bug Report
description: Create a report to help us improve NV-Gateway
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue! Please provide details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Operating System, Node.js version, browser, etc.
      placeholder: |
        - OS: Windows 11 / Linux / macOS
        - Node Version: v20.x
        - Browser: Chrome / Firefox
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Outputs
      description: Please copy and paste any relevant logs or error output (remember to redact secrets!).
      render: shell
    validations:
      required: false
